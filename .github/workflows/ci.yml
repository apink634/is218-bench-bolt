name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint (incl. security rules)
        run: ruff check .
      - name: Types
        run: mypy
      - name: Security scan
        run: bandit -q -r src
      - name: Dependency audit
        run: pip-audit
      - name: Unit + integration tests
        run: pytest --cov=benchbolt --cov-report=term-missing
